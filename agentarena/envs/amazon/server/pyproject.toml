[project]
name = "amazon-app"
version = "0.1.0"
description = "Amazon mockup app with React frontend and FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlmodel>=0.0.14",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "transformers>=4.36.0",
    "safetensors>=0.4.0",
    "pillow>=10.0.0",
    "openai>=1.30.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
amazon = "backend.app:main"
amazon-agent = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "agent"]
