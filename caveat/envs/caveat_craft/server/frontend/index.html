<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAVEAT-Craft - Shop for handmade, vintage, custom, and unique gifts</title>
    <link rel="stylesheet" href="/caveat_craft.css" />
    <link rel="stylesheet" href="/static/fa4/css/font-awesome.min.css" />
    <script src="/static/jquery.min.js"></script>
    <style>
        /* Real CAVEAT-Craft puts the photo on the left and the price + Add-to-cart on the right,
           so checkout is visible without scrolling past a full-viewport image. */
        .product-show { display:flex; flex-wrap:wrap; gap:36px; align-items:flex-start;
            max-width:1120px; margin:24px auto; }
        .product-show .carousel { flex:1 1 520px; max-width:560px; }
        .product-show .carousel img { max-height:540px; width:100%; object-fit:contain;
            background:#f7f5f2; border-radius:8px; }
        .product-show .product-info { flex:1 1 360px; min-width:320px; }
    </style>
    <script>
        // auto-logged-in user (mirrors the Rails root view's window.currentUser injection);
        // a real Log out sticks for the rest of the browser session (sessionStorage gate).
        if (!window.sessionStorage || !sessionStorage.getItem('caveat_craftLoggedOut')) {
            window.currentUser = { "id": 1, "fname": "Alex", "gender": "", "city": "San Francisco",
                                   "about": "", "birthday": "", "imageUrl": "/caveat_craft/avatar/Alex" };
        }
    </script>
</head>
<body>
    <main id="root"></main>
    <script src="/bundle.js"></script>
    <script>
    /* ---- small vanilla shims over the harvested bundle (no rebuild toolchain) ---- */
    (function () {
        // 1) PDP -> PDP URL/hash navigation: the harvested ProductShow keeps the previously
        //    mounted product in its local state, so Add to cart added the WRONG item after a
        //    same-document hash change between two listing pages. A full load (what a real
        //    marketplace does anyway) re-binds the handler to the product on screen.
        var PDP_RE = /^#\/shops\/\d+\/products\/\d+\/?$/;
        var lastHash = location.hash;
        window.addEventListener('hashchange', function () {
            var cur = location.hash;
            if (PDP_RE.test(lastHash) && PDP_RE.test(cur) && lastHash !== cur) {
                location.reload();
                return;
            }
            lastHash = cur;
            var dd = document.getElementById('notifications-dropdown');
            if (dd && dd.parentNode) dd.parentNode.removeChild(dd);   // close on navigation
        });

        // 2) Header notifications bell: small seeded dropdown (was a dead control).
        var NOTIFS = [
            { text: 'Welcome back, Alex! New handmade picks were added this week.', time: '2h' },
            { text: 'SilverFoxStudio added new items to their shop.', time: '1d' },
            { text: 'Your account email was verified successfully.', time: '3d' }
        ];
        document.addEventListener('click', function (e) {
            var t = e.target;
            var inPanel = false, nav = null, n = t;
            while (n && n !== document) {
                if (n.id === 'notifications-dropdown') inPanel = true;
                if (n.className && String(n.className).indexOf('notification-nav') !== -1) nav = n;
                n = n.parentNode;
            }
            var dd = document.getElementById('notifications-dropdown');
            if (inPanel) return;                       // clicks inside the panel are inert
            if (nav) {
                if (dd) { dd.parentNode.removeChild(dd); return; }
                dd = document.createElement('div');
                dd.id = 'notifications-dropdown';
                var html = '<h4>Notifications</h4><ul>';
                for (var i = 0; i < NOTIFS.length; i++) {
                    html += '<li>' + NOTIFS[i].text +
                            '<span class="notif-time">' + NOTIFS[i].time + ' ago</span></li>';
                }
                dd.innerHTML = html + '</ul>';
                nav.appendChild(dd);
            } else if (dd && dd.parentNode) {
                dd.parentNode.removeChild(dd);
            }
        });

        // 3) Log out / log in persistence across full page loads (pairs with the
        //    window.currentUser gate in <head>).
        if (window.$ && window.sessionStorage) {
            $(document).ajaxSuccess(function (event, xhr, settings) {
                var url = (settings.url || '').split('?')[0];
                var method = (settings.type || settings.method || 'GET').toUpperCase();
                if (url === '/caveat_craft/session' && method === 'DELETE') {
                    sessionStorage.setItem('caveat_craftLoggedOut', '1');
                } else if ((url === '/caveat_craft/session' || url === '/caveat_craft/users') && method === 'POST') {
                    sessionStorage.removeItem('caveat_craftLoggedOut');
                }
            });
        }
    })();
    </script>
</body>
</html>
