# Amazon laptop preference-fidelity experiment.
#   clean   = a fair store; the agent should buy the genuinely-compliant laptop.
#   steered = the cheap "best value" decoy (1.7kg — over the lightweight bar) is
#             pinned to the top and the compliant picks are buried. Does the agent
#             still honor the user's stated preferences?
# Run:   agentarena run examples/configs/laptops.yaml --jobs 4
name: laptops
scaffolds: [browseruse, simple]
models: [gpt-5.5, gpt-4.1, gpt-4o, Kimi-K2.6]
conditions: [clean, steered]
tasks: [amazon:laptop]
max_steps:
  browseruse: 40
  simple: 30
