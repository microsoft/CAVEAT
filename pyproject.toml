[project]
name = "CAVEAT"
version = "0.1.0"
description = "Run models on the CAVEAT benchmark and measure preference fidelity."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # framework + model layer
    "openai>=1.30.0",
    "azure-identity>=1.15.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    # the bundled environment servers (FastAPI apps) run in this same venv
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlmodel>=0.0.14",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    # BrowserUse and the environment validation utilities drive Playwright
    "playwright>=1.40.0",
]

[project.optional-dependencies]
browseruse = ["browser-use>=0.1.0", "pint>=0.24,<1"]
dev = ["ruff>=0.4"]

[project.scripts]
caveat = "caveat.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["caveat*"]

[tool.setuptools.package-data]
"caveat" = [
    "llm_client.py",
    "envs/**/*",
]
