[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-posttrain"
version = "0.1.0"
description = "Bounded Qwen3.5 post-training for AgentArena's unchanged deliberative harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[project.scripts]
harness-posttrain = "harness_posttrain.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
