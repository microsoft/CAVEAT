[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "CAVEAT-27B-final-stages"
version = "0.1.0"
description = "Receipt-bound late-stage training code for CAVEAT-27B"
requires-python = "==3.12.*"
dependencies = [
    "accelerate==1.14.0",
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "peft==0.20.0",
    "pydantic==2.12.5",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "uvicorn==0.51.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
